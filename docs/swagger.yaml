definitions:
  server.LibraryVO:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      default_visibility:
        type: string
      deleted_at:
        type: string
      deleted_by:
        type: string
      entries:
        items:
          $ref: '#/definitions/vo.LibraryEntryVO'
        type: array
      id:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
      user_id:
        type: string
    type: object
  server.LoanVO:
    properties:
      borrower_name:
        type: string
      borrower_user_id:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      deleted_at:
        type: string
      deleted_by:
        type: string
      id:
        type: string
      lender_user_id:
        type: string
      lent_at:
        type: string
      returned_at:
        type: string
      status:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
      volume_id:
        type: string
    type: object
  server.TableVO:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      deleted_at:
        type: string
      deleted_by:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
      user_id:
        type: string
      visibility:
        type: string
      volume_ids:
        items:
          type: string
        type: array
      volume_titles:
        additionalProperties:
          type: string
        type: object
    type: object
  server.WishlistVO:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      deleted_at:
        type: string
      deleted_by:
        type: string
      entries:
        items:
          $ref: '#/definitions/vo.WishlistEntryVO'
        type: array
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
      user_id:
        type: string
      visibility:
        type: string
    type: object
  server.createLoanRequest:
    properties:
      borrower_name:
        example: Jordan
        type: string
      borrower_user_id:
        example: user-456
        type: string
      volume_id:
        example: vol-123
        type: string
    type: object
  server.createTableRequest:
    properties:
      name:
        example: Friday night group
        type: string
    type: object
  server.createWishlistRequest:
    properties:
      name:
        example: Birthday wishlist
        type: string
    type: object
  server.previewResponse:
    properties:
      affected_volume_ids:
        example:
        - vol-123
        - vol-456
        items:
          type: string
        type: array
    type: object
  server.titleRequest:
    properties:
      title:
        example: Curse of Strahd (2nd printing)
        type: string
    type: object
  server.visibilityRequest:
    properties:
      visibility:
        example: friends
        type: string
    type: object
  server.volumeEntryRequest:
    properties:
      volume_id:
        example: vol-123
        type: string
      volume_title:
        example: Curse of Strahd
        type: string
    type: object
  vo.ErrorVO:
    properties:
      error:
        type: string
      message:
        type: string
    type: object
  vo.HealthResponseVO:
    properties:
      collections:
        items:
          type: string
        type: array
      database:
        type: string
      errors:
        type: integer
      messages:
        items:
          type: string
        type: array
      ping:
        type: string
    type: object
  vo.LibraryEntryVO:
    properties:
      added_at:
        type: string
      visibility_override:
        type: string
      volume_id:
        type: string
      volume_title:
        type: string
    type: object
  vo.PingResponseVO:
    properties:
      date:
        type: string
      hostname:
        type: string
    type: object
  vo.WishlistEntryVO:
    properties:
      added_at:
        type: string
      volume_id:
        type: string
      volume_title:
        type: string
    type: object
info:
  contact:
    email: admin@sweetrpg.com
    name: API Support
    url: https://sweetrpg.com
  description: 'HTTP API for the SweetRPG Game Room domain: a user''s library (owned
    catalog volumes), wishlists, play tables, and peer-to-peer volume loans, each
    with per-resource visibility controls.'
  license:
    name: MIT
    url: https://mit-license.org/
  termsOfService: https://pilgrimagesoftware.com/terms/
  title: Game Room API service
  version: "1.0"
paths:
  /status/health:
    get:
      description: Check the application's own health plus its dependencies (database,
        cache). Returns 503 if any dependency check fails.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/vo.HealthResponseVO'
        "503":
          description: one or more dependency checks failed
          schema:
            $ref: '#/definitions/vo.HealthResponseVO'
      summary: Health check
      tags:
      - status
  /status/ping:
    get:
      description: Ping
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/vo.PingResponseVO'
      summary: Ping
      tags:
      - status
  /users/{user_id}/library:
    get:
      description: Get a user's library, filtered to what the caller may see.
      parameters:
      - description: User ID
        example: user-123
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.LibraryVO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Get library
      tags:
      - library
  /users/{user_id}/library/default-visibility:
    put:
      consumes:
      - application/json
      description: 'Set the visibility applied to library entries that have no per-entry
        override. Valid visibility values: public, friends, friends_of_friends, private.'
      parameters:
      - description: User ID
        example: user-123
        in: path
        name: user_id
        required: true
        type: string
      - description: New default visibility
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.visibilityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.LibraryVO'
        "400":
          description: invalid body or invalid visibility value
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Set library default visibility
      tags:
      - library
  /users/{user_id}/library/default-visibility/preview:
    post:
      consumes:
      - application/json
      description: Dry-run a default-visibility change, returning the volume IDs of
        entries that would become more exposed - backs the warning dialog before the
        caller commits to the change.
      parameters:
      - description: User ID
        example: user-123
        in: path
        name: user_id
        required: true
        type: string
      - description: Proposed new default visibility
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.visibilityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.previewResponse'
        "400":
          description: invalid body or invalid visibility value
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Preview library default-visibility change
      tags:
      - library
  /users/{user_id}/library/entries:
    post:
      consumes:
      - application/json
      description: Link a catalog volume into the caller's own library.
      parameters:
      - description: User ID
        example: user-123
        in: path
        name: user_id
        required: true
        type: string
      - description: Volume to add
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.volumeEntryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.LibraryVO'
        "400":
          description: volume_id missing
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Add library entry
      tags:
      - library
  /users/{user_id}/library/entries/{volume_id}:
    delete:
      description: Unlink a catalog volume from the caller's own library.
      parameters:
      - description: User ID
        example: user-123
        in: path
        name: user_id
        required: true
        type: string
      - description: Volume ID
        example: vol-123
        in: path
        name: volume_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.LibraryVO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Remove library entry
      tags:
      - library
  /users/{user_id}/library/entries/{volume_id}/title:
    put:
      consumes:
      - application/json
      description: Refresh the denormalized title snapshot on a single library entry.
      parameters:
      - description: User ID
        example: user-123
        in: path
        name: user_id
        required: true
        type: string
      - description: Volume ID
        example: vol-123
        in: path
        name: volume_id
        required: true
        type: string
      - description: New title
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.titleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.LibraryVO'
        "400":
          description: title missing
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "404":
          description: no entry for this volume_id in the library
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Update library entry title
      tags:
      - library
  /users/{user_id}/library/entries/{volume_id}/visibility:
    put:
      consumes:
      - application/json
      description: 'Set (or clear, with an empty visibility) a per-entry visibility
        override. Valid visibility values: public, friends, friends_of_friends, private.'
      parameters:
      - description: User ID
        example: user-123
        in: path
        name: user_id
        required: true
        type: string
      - description: Volume ID
        example: vol-123
        in: path
        name: volume_id
        required: true
        type: string
      - description: New override (empty clears it)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.visibilityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.LibraryVO'
        "400":
          description: invalid body or invalid visibility value
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Set library entry visibility override
      tags:
      - library
  /users/{user_id}/loans:
    get:
      description: List the volumes a user has lent out, both open and returned.
      parameters:
      - description: User ID
        example: user-123
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/server.LoanVO'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: List lent loans
      tags:
      - loans
    post:
      consumes:
      - application/json
      description: Lend a catalog volume to a platform-linked user or a free-form
        name. Exactly one of borrower_user_id or borrower_name is required; when borrower_user_id
        is given, borrower_name must also be supplied as that user's display name.
      parameters:
      - description: User ID (the lender)
        example: user-123
        in: path
        name: user_id
        required: true
        type: string
      - description: Loan details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.createLoanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.LoanVO'
        "400":
          description: volume_id missing, or borrower fields don't satisfy the exactly-one-of
            rule
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "409":
          description: volume is already out on an open loan
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Create loan
      tags:
      - loans
  /users/{user_id}/loans/{loan_id}:
    delete:
      description: Permanently remove a loan record. Lender-only.
      parameters:
      - description: User ID (the lender)
        example: user-123
        in: path
        name: user_id
        required: true
        type: string
      - description: Loan ID
        example: loan-789
        in: path
        name: loan_id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "403":
          description: loan exists but is owned by a different lender
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "404":
          description: no loan with this ID exists
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Delete loan
      tags:
      - loans
  /users/{user_id}/loans/{loan_id}/return:
    post:
      description: Mark a lent-out loan as returned. Lender-only.
      parameters:
      - description: User ID (the lender)
        example: user-123
        in: path
        name: user_id
        required: true
        type: string
      - description: Loan ID
        example: loan-789
        in: path
        name: loan_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.LoanVO'
        "403":
          description: loan exists but is owned by a different lender
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "404":
          description: no loan with this ID exists
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Return loan
      tags:
      - loans
  /users/{user_id}/loans/borrowed:
    get:
      description: List the volumes a platform-linked user has borrowed, both open
        and returned.
      parameters:
      - description: User ID
        example: user-456
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/server.LoanVO'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: List borrowed loans
      tags:
      - loans
  /users/{user_id}/tables:
    get:
      description: List a user's tables, filtered to what the caller may see.
      parameters:
      - description: User ID
        example: user-123
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/server.TableVO'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: List tables
      tags:
      - tables
    post:
      consumes:
      - application/json
      description: Create a new table, defaulting to private visibility.
      parameters:
      - description: User ID
        example: user-123
        in: path
        name: user_id
        required: true
        type: string
      - description: Table name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.createTableRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.TableVO'
        "400":
          description: name missing
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Create table
      tags:
      - tables
  /users/{user_id}/tables/{id}:
    delete:
      description: Permanently remove a table. Owner-only.
      parameters:
      - description: User ID
        example: user-123
        in: path
        name: user_id
        required: true
        type: string
      - description: Table ID
        example: tbl-789
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "403":
          description: table exists but is owned by a different user
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "404":
          description: no table with this ID exists
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Delete table
      tags:
      - tables
    get:
      description: Get one table by ID, if the caller may see it.
      parameters:
      - description: User ID
        example: user-123
        in: path
        name: user_id
        required: true
        type: string
      - description: Table ID
        example: tbl-789
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.TableVO'
        "404":
          description: no table with this ID exists, or the caller may not see it
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Get table
      tags:
      - tables
    put:
      consumes:
      - application/json
      description: Change a table's name. Owner-only.
      parameters:
      - description: User ID
        example: user-123
        in: path
        name: user_id
        required: true
        type: string
      - description: Table ID
        example: tbl-789
        in: path
        name: id
        required: true
        type: string
      - description: New name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.createTableRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.TableVO'
        "400":
          description: name missing
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "403":
          description: table exists but is owned by a different user
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "404":
          description: no table with this ID exists
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Rename table
      tags:
      - tables
  /users/{user_id}/tables/{id}/visibility:
    put:
      consumes:
      - application/json
      description: 'Set a table''s visibility. Owner-only. Valid visibility values:
        public, friends, friends_of_friends, private.'
      parameters:
      - description: User ID
        example: user-123
        in: path
        name: user_id
        required: true
        type: string
      - description: Table ID
        example: tbl-789
        in: path
        name: id
        required: true
        type: string
      - description: New visibility
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.visibilityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.TableVO'
        "400":
          description: invalid body or invalid visibility value
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "403":
          description: table exists but is owned by a different user
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "404":
          description: no table with this ID exists
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Set table visibility
      tags:
      - tables
  /users/{user_id}/tables/{id}/volumes:
    post:
      consumes:
      - application/json
      description: Add a catalog volume to a table's shared pool. Owner-only.
      parameters:
      - description: User ID
        example: user-123
        in: path
        name: user_id
        required: true
        type: string
      - description: Table ID
        example: tbl-789
        in: path
        name: id
        required: true
        type: string
      - description: Volume to add
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.volumeEntryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.TableVO'
        "400":
          description: volume_id missing
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "403":
          description: table exists but is owned by a different user
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "404":
          description: no table with this ID exists
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Add table volume
      tags:
      - tables
  /users/{user_id}/tables/{id}/volumes/{volume_id}:
    delete:
      description: Remove a catalog volume from a table's shared pool. Owner-only.
      parameters:
      - description: User ID
        example: user-123
        in: path
        name: user_id
        required: true
        type: string
      - description: Table ID
        example: tbl-789
        in: path
        name: id
        required: true
        type: string
      - description: Volume ID
        example: vol-123
        in: path
        name: volume_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.TableVO'
        "403":
          description: table exists but is owned by a different user
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "404":
          description: no table with this ID exists
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Remove table volume
      tags:
      - tables
  /users/{user_id}/wishlists:
    get:
      description: List a user's wishlists, filtered to what the caller may see.
      parameters:
      - description: User ID
        example: user-123
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/server.WishlistVO'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: List wishlists
      tags:
      - wishlist
    post:
      consumes:
      - application/json
      description: Create a new named wishlist, defaulting to private visibility.
      parameters:
      - description: User ID
        example: user-123
        in: path
        name: user_id
