        type: string
    type: object
  vo.PingResponseVO:
    properties:
      date:
        type: string
      hostname:
        type: string
    type: object
info:
  contact:
    email: admin@sweetrpg.com
    name: API Support
    url: https://sweetrpg.com
  description: Swagger APIs
  license:
    name: MIT
    url: https://mit-license.org/
  termsOfService: https://pilgrimagesoftware.com/terms/
  title: Game Room API service
  version: "1.0"
paths:
  /status/health:
    get:
      description: Health check
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/vo.HealthResponseVO'
      summary: Health check
      tags:
      - status
  /status/ping:
    get:
      description: Ping
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/vo.PingResponseVO'
      summary: Ping
      tags:
      - status
  /users/{user_id}/library:
    get:
      description: Get a user's library, filtered to what the caller may see.
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      summary: Get library
      tags:
      - library
  /users/{user_id}/library/default-visibility:
    put:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: string
      - description: New default visibility
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.visibilityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      summary: Set library default visibility
      tags:
      - library
  /users/{user_id}/library/default-visibility/preview:
    post:
      consumes:
      - application/json
      description: Dry-run a default-visibility change, returning the volume IDs of
        entries that would become more exposed - backs the warning dialog before the
        caller commits to the change.
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: string
      - description: Proposed new default visibility
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.visibilityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.previewResponse'
        "400":
          description: Bad Request
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      summary: Preview library default-visibility change
      tags:
      - library
  /users/{user_id}/library/entries:
    post:
      consumes:
      - application/json
      description: Link a catalog volume into the caller's own library.
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: string
      - description: Volume to add
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.volumeEntryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      summary: Add library entry
      tags:
      - library
  /users/{user_id}/library/entries/{volume_id}:
    delete:
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: string
      - description: Volume ID
        in: path
        name: volume_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
