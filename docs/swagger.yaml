definitions:
  server.createLoanRequest:
    properties:
      borrower_name:
        type: string
      borrower_user_id:
        type: string
      volume_id:
        type: string
    type: object
  server.createTableRequest:
    properties:
      name:
        type: string
    type: object
  server.createWishlistRequest:
    properties:
      name:
        type: string
    type: object
  server.previewResponse:
    properties:
      affected_volume_ids:
        items:
          type: string
        type: array
    type: object
  server.titleRequest:
    properties:
      title:
        type: string
    type: object
  server.visibilityRequest:
    properties:
      visibility:
        type: string
    type: object
  server.volumeEntryRequest:
    properties:
