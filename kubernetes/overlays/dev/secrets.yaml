---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: game-room-api-auth

spec:
    refreshInterval: "1h"
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-auth
        creationPolicy: Owner
    dataFrom:
        - extract:
              key: Auth0

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: game-room-api-db

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-db
        creationPolicy: Owner
    dataFrom:
        # Same Akeyless value atlas-db-user.yaml's ExternalSecret reads (rewritten to "password"
        # there, since the Atlas Operator expects that exact key name) - one password (Akeyless
        # field DB_PASSWORD), read by two ExternalSecrets, so this app and the Atlas-side user
        # the Operator provisions always agree on it. NOT YET PROVISIONED - see
        # kubernetes/overlays/dev/atlas-db-user.yaml's own comment; /sweetrpg/game-room/api/db needs
        # a DB_PASSWORD field created in Akeyless before this resolves.
        - extract:
              key: /sweetrpg/game-room/api/db
          rewrite:
              - regexp:
                    source: "DB_PASSWORD"
                    target: DB_PW

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: game-room-api-misc

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-misc
        creationPolicy: Owner
    dataFrom:
        # NOT YET PROVISIONED - /sweetrpg/game-room/api/misc doesn't exist in Akeyless yet.
        - extract:
              key: /sweetrpg/game-room/api/misc

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: game-room-api-cache

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-cache
        creationPolicy: Owner
    dataFrom:
        # Game Room has no dedicated cache instance provisioned yet (see
        # docs/deployment-conventions.md's "one cache instance per service" target). Until
        # support/infrastructure adds one, REDIS_HOST is deliberately left unset in
        # configmaps.yaml - the app falls back to its in-memory cache store, a fully supported
        # mode (see service-conventions.md's Caching section). This ExternalSecret is a
        # placeholder pointed at the shared support cache client path so it's a one-line
        # REDIS_HOST addition once a real instance exists, not a new secret to wire up.
        - extract:
              key: /sweetrpg/support/cache/client

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: game-room-api-nats

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-nats
        creationPolicy: Owner
    data:
        - secretKey: NATS_USER
          remoteRef:
              key: /sweetrpg/game-room/api/nats/auth
              property: username
        - secretKey: NATS_PASSWORD
          remoteRef:
              key: /sweetrpg/game-room/api/nats/auth
              property: password
