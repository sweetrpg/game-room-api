---
# game-room-api's own database user, scoped to only its own database - the shared "sweetrpg" user
# (readWriteAnyDatabase) is not for service use. Same pattern as admin-api/catalog-api/users-api's
# own kubernetes/overlays/dev/atlas-db-user.yaml.
#
# Named "game-room-api"/sweetrpg-game-room to match the live Atlas database user (already provisioned
# manually ahead of this CR) rather than this directory's surrounding library-api naming - the
# Shelf rebuild hasn't touched the rest of these manifests yet (namespace, secret names, and
# Akeyless paths here are still the old library-api ones). This CR intentionally gets ahead of
# that so the Operator manages the live user instead of leaving it untracked.
apiVersion: atlas.mongodb.com/v1
kind: AtlasDatabaseUser

metadata:
  name: game-room-api

spec:
  databaseName: admin
  username: game-room-api
  passwordSecretRef:
    name: game-room-api-db-credentials
  projectRef:
    name: sweetrpg
    namespace: sweetrpg-db
  roles:
    - databaseName: sweetrpg-game-room
      roleName: readWrite
  x509Type: NONE

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: game-room-api-db-credentials

spec:
  refreshInterval: 1h
  secretStoreRef:
    name: akeyless
    kind: ClusterSecretStore
  target:
    name: game-room-api-db-credentials
    template:
      metadata:
        labels:
          atlas.mongodb.com/type: credentials
    creationPolicy: Owner
  dataFrom:
    # Akeyless path /sweetrpg/game-room/api/db doesn't exist yet - needs to be created (DB_PASSWORD
    # field) before this ExternalSecret resolves and the Operator can set the live user's
    # password to match. No live consumer currently authenticates as game-room-api (sweetrpg-library
    # has no running pods under the new naming yet), so provisioning a fresh password here is
    # safe - nothing to break.
    - extract:
        key: /sweetrpg/game-room/api/db
      rewrite:
        - regexp:
            source: "DB_PASSWORD"
            target: "password"
