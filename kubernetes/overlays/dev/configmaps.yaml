---
apiVersion: v1
kind: ConfigMap

metadata:
  name: api-env

data:
  ENV: dev
  # mongodb.go builds the connection string from these DB_* parts rather than one opaque
  # DB_URI - only the password (DB_PW, in secrets.yaml) is sensitive.
  DB_SCHEME: mongodb+srv
  DB_HOST: cluster0.z9nxg.mongodb.net
  DB_USER: game-room-api
  DB_NAME: sweetrpg-game-room
  DB_OPTS: retryWrites=true&w=majority
  BUILD_INFO_PATH: /app/config/build-info.json
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo-distributor.observability.svc.cluster.local:4318/
  PYROSCOPE_SERVER_ADDRESS: http://pyroscope.observability.svc.cluster.local:4040
  PYROSCOPE_TENANT_ID: psw
  SENTRY_RELEASE: "1"
  # No dedicated cache instance for Game Room yet (see secrets.yaml's game-room-api-cache comment) -
  # REDIS_HOST deliberately unset until support/infrastructure provisions one. The service falls
  # back to its in-memory cache store, a fully supported mode.
  CACHE_TTLS: "library=30m,wishlist=30m,tables=15m"
  CACHE_DEFAULT_TTL: 1h
  INGRESS_BASE_PATH: /api/0/game-room
  INGRESS_HOST: dev.sweetrpg.com
  INGRESS_SCHEMES: http,https
  # authz.Client fails open to an empty baseURL rather than refusing to start - unset here
  # silently returns every viewer as anonymous rather than a startup error.
  AUTH_API_URL: http://api-v1.sweetrpg-auth.svc.cluster.local:8000
