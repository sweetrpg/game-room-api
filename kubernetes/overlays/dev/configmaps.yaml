---
apiVersion: v1
kind: ConfigMap

metadata:
  name: api-env

data:
  ENV: dev
  # mongodb.go builds the connection string from these DB_* parts rather than one opaque
  # DB_URI - only the password (DB_PW, in secrets.yaml) is sensitive.
  DB_SCHEME: mongodb+srv
  DB_HOST: cluster0.z9nxg.mongodb.net
  DB_USER: game-room-api
  DB_NAME: sweetrpg-game-room
  DB_OPTS: retryWrites=true&w=majority
  BUILD_INFO_PATH: /app/config/build-info.json
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo-distributor.observability.svc.cluster.local:4318/
  PYROSCOPE_SERVER_ADDRESS: http://pyroscope.observability.svc.cluster.local:4040
  PYROSCOPE_TENANT_ID: psw
  SENTRY_RELEASE: "1"
  # Namespace cache Service (support/infrastructure game-room/cache, clusters/dev/game-room/cache.yaml).
  # Backs the response cache and the distributed rate-limit counters.
  REDIS_HOST: cache.sweetrpg-game-room.svc.cluster.local
  REDIS_PORT: "6379"
  CACHE_TTLS: "library=30m,wishlist=30m,tables=15m"
  CACHE_DEFAULT_TTL: 1h
  # Per-client/IP rate limiting (platform rate-limiting capability, #106). api-core defaults.
  RATE_LIMIT_CHEAP: "120"
  RATE_LIMIT_CHEAP_WINDOW_SECONDS: "60"
  RATE_LIMIT_STANDARD: "30"
  RATE_LIMIT_STANDARD_WINDOW_SECONDS: "60"
  INGRESS_BASE_PATH: /api/0/game-room
  INGRESS_HOST: dev.sweetrpg.com
  INGRESS_SCHEMES: http,https
  # authz.Client fails open to an empty baseURL rather than refusing to start - unset here
  # silently returns every viewer as anonymous rather than a startup error.
  AUTH_API_URL: http://api-v1.sweetrpg-auth.svc.cluster.local:8000
  # USERS_API_URL resolves the verified subject to its canonical users._id user ID via
  # GET /api/profile (migrate-game-room-user-ids). Unset would resolve every authenticated
  # caller as anonymous and 403 every owner-scoped write.
  USERS_API_URL: http://api-v1.sweetrpg-users.svc.cluster.local:8000
  # Volume title sync consumer (task 4.2-4.6: consume catalog volume.updated events and sync titles)
  NATS_URL: nats://nats.nats-system.svc.cluster.local:4222
  NATS_STREAM: CATALOG_EVENTS
  NATS_DURABLE_NAME: game-room-api-volume-title-sync
