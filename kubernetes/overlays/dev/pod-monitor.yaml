---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor

metadata:
  name: sweetrpg-game-room-api
  labels:
    release: prometheus

spec:
  podMetricsEndpoints:
    - port: http
  selector:
    matchLabels:
        app.kubernetes.io/name: game-room-api
        app.kubernetes.io/version: v1
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: game-room
  namespaceSelector:
    matchNames:
      - sweetrpg-game-room
